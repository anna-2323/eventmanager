<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventMGR - събития</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/res/style.css" />
  <link rel="stylesheet" href="/res/events.css" />
</head>

<body>
  <header id="header">
  </header>

  <main class="main">

    <div id="events-container" class="m-5">

      <div id="events-heading" class="has-text-centered p-5">
        <h3 class="title is-2" id="events-title">Събития</h3>
        <p class="subtitle is-4" id="events-subtitle">Всички събития</p>
      </div>

      <div id="events-filters">

        <div class="events-filter m-4">
          <div class="field has-addons">
            <div class="control has-icons-right">
              <input class="input" id="events-search" type="search">
              <span class="icon is-right">
                <i class="fas fa-search"></i>
              </span>
            </div>
          </div>
        </div>

        <div class="events-filter dropdown is-hoverable m-4" id="category-filter">
          <div class="dropdown-trigger">
            <button class="button" aria-haspopup="true" aria-controls="dropdown-menu">
              <span>Категория</span>
              <span class="icon is-small">
                <i class="fas fa-angle-down" aria-hidden="true"></i>
              </span>
            </button>
          </div>
          <div class="dropdown-menu" role="menu">
            <div class="dropdown-content" id="category-dropdown">
            </div>
          </div>
        </div>

        <div class="events-filter dropdown is-hoverable m-4" id="city-filter">
          <div class="dropdown-trigger">
            <button class="button" aria-haspopup="true" aria-controls="dropdown-menu">
              <span>Град</span>
              <span class="icon is-small">
                <i class="fas fa-angle-down" aria-hidden="true"></i>
              </span>
            </button>
          </div>
          <div class="dropdown-menu" role="menu">
            <div class="dropdown-content" id="city-dropdown">
            </div>
          </div>
        </div>

        <div class="events-filter dropdown is-hoverable m-4" id="date-filter">
          <div class="dropdown-trigger">
            <button
              class="button"
              aria-haspopup="true"
              aria-controls="date-dropdown-menu">
              <span id="date-filter-label">Дата</span>
              <span class="icon is-small">
                <i class="fas fa-angle-down" aria-hidden="true"></i>
              </span>
            </button>
          </div>

          <div class="dropdown-menu" id="date-dropdown-menu" role="menu">
            <div class="dropdown-content p-4" style="min-width: 300px;">
              <div class="field">
                <label class="label">От</label>
                <div class="control">
                  <input class="input" type="datetime-local" id="date-from">
                </div>
              </div>
            
              <div class="field">
                <label class="label">До</label>
                <div class="control">
                  <input class="input" type="datetime-local" id="date-to">
                </div>
              </div>
            </div>
          </div>
        </div>

        <a class="button is-primary m-4" id="btn-filters-apply">Покажи събития</a>
        <a class="button is-info m-4" id="btn-filters-clear">Изчисти филтри</a>

        <div class="events-filter dropdown is-hoverable m-4">
          <div class="dropdown-trigger">
            <button class="button" aria-haspopup="true" aria-controls="dropdown-menu">
              <span>Сортиране</span>
              <span class="icon is-small">
                <i class="fas fa-angle-down" aria-hidden="true"></i>
              </span>
            </button>
          </div>
          <div class="dropdown-menu" id="dropdown-menu" role="menu">
            <div class="dropdown-content">
              <a class="dropdown-item" data-sort="upcoming">Предстоящи</a>
              <a class="dropdown-item" data-sort="price_asc">Цена възх.</a>
              <a class="dropdown-item" data-sort="price_desc">Цена низх.</a>
            </div>
          </div>
        </div>
    </div>

    <div id="events-content" class="pt-5">
      <div class="grid is-col-min-5 is-column-gap-3 is-row-gap-3" id="events">
      </div>
      <div id="pagination"></div>
    </div>

    </div>
  </main>

  <script src="/js/pages/events.js" type="module"></script>
</body>

</html>
