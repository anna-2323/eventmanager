<!DOCTYPE html>
<html lang="bg" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Купи билет</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/res/style.css" />
    <link rel="stylesheet" href="/res/purchase.css" />
</head>

<body>

    <header id="header">
    </header>

    <section class="section">
        <div class="container is-max-tablet">
            <h1 class="title" id="event-title">Зареждане...</h1>
            <div class="box">
                <div class="field">
                    <label class="label">Име</label>
                    <div class="control">
                        <input class="input" type="text" id="first_name">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Фамилия</label>
                    <div class="control">
                        <input class="input" type="text" id="last_name">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Имейл</label>
                    <div class="control">
                        <input class="input" type="email" id="email">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Телефон</label>
                    <div class="control">
                        <input class="input" type="tel" id="phone">
                    </div>
                </div>
                <div id="event-layout-field" style="display:none;">
                    <svg id="seat-map">
                    </svg>
                    <div id="sector-summary" style="visibility:hidden;">
                      <div id="sector-id-input"></div>
                      <p>Избран сектор: <strong id="summary-name"></strong></p>
                      <p><span id="summary-price"></span><span id="summary-available"></span> останали места</p>
                    </div>
                </div>
                <button class="button is-primary is-fullwidth" id="submit">Потвърди покупката</button>
                <p class="help is-danger mt-2" id="error" style="display:none"></p>
            </div>
        </div>
    </section>

    <script src="/js/pages/purchase.js" type="module"></script>
</body>

</html>
