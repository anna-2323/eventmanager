<!DOCTYPE html>
<html lang="bg" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Създаване на събитие</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/res/style.css" />
</head>

<body>
    <header id="header">
    </header>

    <main id="main" class="main is-max-tablet">
        <div class="container is-max-tablet">
            <h1 class="title mt-4" id="event-title">Добавяне на зала</h1>
            <div class="box">
                <div class="field">
                    <label class="label">Име</label>
                    <div class="control">
                        <input class="input" type="text" id="venue-name">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Адрес</label>
                    <div class="control">
                        <input class="input" type="text" id="address">
                    </div>
                </div>
                <div class="field">
                  <label class="label">Град</label>
                  <div class="control">
                    <input
                      class="input"
                      type="text"
                      id="city"
                      list="cities"
                      placeholder="Изберете или въведете нов град"
                    >
                    <datalist id="cities">
                    </datalist>
                  </div>
                </div>
                
                <button class="button is-primary is-fullwidth" id="submit">Добавяне</button>
            </div>
            <p class="help is-danger mt-2" id="error" style="display:none"></p>
        </div>
        </div>
    </main>

    <script src="/js/pages/create_venue.js" type="module"></script>
</body>

</html>
