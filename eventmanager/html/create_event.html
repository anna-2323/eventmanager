<!DOCTYPE html>
<html lang="bg" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Създаване на събитие</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/res/style.css" />
</head>

<body>
    <header id="header">
    </header>

    <main id="main" class="main is-max-tablet">
        <div class="container">
            <h1 class="title mt-4" id="event-title">Създаване на събитие</h1>
            <div class="box">
                <div class="field">
                    <label class="label">Заглавие</label>
                    <div class="control">
                        <input class="input" type="text" id="title">
                    </div>
                </div>
                <div class="field">
                  <label class="label">Зала</label>
                  <div class="control">
                    <div class="select is-fullwidth">
                      <select id="venue">
                        <option value="" disabled selected>Изберете зала</option>
                      </select>
                    </div>
                  </div>
                </div>
                <div class="field">
                    <label class="label">Време на започване</label>
                    <div class="control">
                        <input class="input" type="datetime-local" id="begins-at">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Цена за вход</label>
                    <div class="control">
                        <input class="input" type="price" id="price">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Капацитет</label>
                    <div class="control">
                        <input class="input" type="number" id="capacity">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Описание</label>
                    <div class="control">
                        <textarea class="textarea" id="description"
                                  placeholder="Описание на събитието"
                                  maxlength="512"></textarea>
                    </div>
                </div>
                
                <div class="field">
                    <label class="label">Изображение</label>
                    <div class="control">
                        <input class="input" type="file" id="image"
                               accept="image/jpeg,image/png,image/webp">
                    </div>
                    <p class="help">JPG, PNG или WebP.</p>
                </div>
                <button class="button is-primary is-fullwidth" id="submit">Създаване</button>
                <p class="help is-danger mt-2" id="error" style="display:none"></p>
            </div>
        </div>
        </div>
    </main>

    <script src="/js/pages/create_event.js" type="module"></script>
</body>

</html>
