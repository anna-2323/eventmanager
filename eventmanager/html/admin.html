<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Контролен панел</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/res/style.css" />
    <style>
        #main {
            text-align: center;
            margin: auto;
        }
        .is-primary {
            width: 250px;
        }
    </style>
</head>

<body>
    <header id="header">
    </header>

    <main id="main" class="main mt-4">
        <a class="button is-primary" href="/admin/users">Управление на потребители</a>
        <a class="button is-primary" href="/admin/events">Управление на събития</a>
    </main>

    <script type="module">
        import { header } from '/js/header.js';
        header();
    </script>
    
    <script>
        fetch('/api/me')
            .then(r => r.json())
            .then(user => {
                if (!user.logged_in || user.role !== 0) {
                    document.getElementById('main').innerHTML = `
                    <section class="section">
                        <div class="container has-text-centered">
                            <h1 class="title has-text-danger">Нямате права за достъп до тази страница</h1>
                            <a class="button is-link" href="/home">Начало</a>
                        </div>
                    </section>`;
                    return;
                }
            });
    </script>

</body>

</html>
