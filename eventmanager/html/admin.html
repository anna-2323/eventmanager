<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Контролен панел</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/res/style.css" />
    <style>
        #main {
            text-align: center;
            margin: auto;
        }

        .is-primary {
            width: 250px;
        }
    </style>
</head>

<body>
    <header id="header">
    </header>

    <main id="main" class="main mt-4">
        <h1 class="title mt-4">Контролен панел</h1>

        <div class="columns is-multiline is-centered mt-4">
            <a class="button is-info column is-2 mx-4" href="/admin/users">
                <i class="fa-solid fa-user mr-1" aria-hidden="true"></i>Потребители</a>
            <a class="button is-info column is-2 mx-4" href="/admin/events">
                <i class="fa-solid fa-calendar mr-1" aria-hidden="true"></i>Събития</a>
            <a class="button is-info column is-2 mx-4" href="/admin/tickets">
                <i class="fa-solid fa-ticket mr-1" aria-hidden="true"></i>Билети</a>
            <a class="button is-info column is-2 mx-4" href="/admin/venues">
                <i class="fa-solid fa-location-dot mr-1" aria-hidden="true"></i>Зали</a>
        </div>

        <div class="columns is-multiline is-centered mt-4">
            <a class="button is-success column is-2 mx-4" href="/events/create">Ново събитие</a>
            <a class="button is-success column is-2 mx-4" href="/venues/create">Нова зала</a>
        </div>
        
        <div id="admin-summary" class="columns is-multiline is-centered">
                    <div class="column is-2">
                        <div class="box has-text-centered">
                            <p class="heading">Потребители</p>
                            <p id="total-users" class="title">0</p>
                        </div>
                    </div>

                    <div class="column is-2">
                        <div class="box has-text-centered">
                            <p class="heading">Зали</p>
                            <p id="total-venues" class="title">0</p>
                        </div>
                    </div>

                    <div class="column is-2">
                        <div class="box has-text-centered">
                            <p class="heading">Събития</p>
                            <p id="total-events" class="title">0</p>
                        </div>
                    </div>

                    <div class="column is-2">
                        <div class="box has-text-centered">
                            <p class="heading">Билети</p>
                            <p id="total-tickets" class="title">0</p>
                        </div>
                    </div>
                </div>

        <div class="tabs is-centered">
            <ul>
                <li class="is-active" data-tab="revenue">
                    <a>
                        <span class="icon is-small"><i class="fa-solid fa-money-bill-1-wave"
                                aria-hidden="true"></i></span>
                        <span>Приходи</span>
                    </a>
                </li>
                <li data-tab="growth">
                    <a>
                        <span class="icon is-small"><i class="fa-solid fa-arrow-trend-up" aria-hidden="true"></i></span>
                        <span>Растеж</span>
                    </a>
                </li>
            </ul>
        </div>

        <div id="tab-content">
            <div id="revenue">

                <div class="columns is-centered is-variable is-4">
                    <div class="column is-5">
                        <div class="box">
                            <h2 class="title is-6">Общо</h2>
                            <div style="height: 200px;">
                                <canvas id="revenue-chart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="column is-5">
                        <div class="box">
                            <h2 class="title is-6">По зали</h2>
                            <div style="height: 200px;">
                                <canvas id="revenue-venue-chart"></canvas>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <div id="growth" class="is-hidden">
                <div class="columns is-centered is-variable is-4">
                    <div class="column is-3">
                        <div class="box">
                            <h2 class="title is-6">Регистрирани потребители</h2>
                            <div>
                                <input type="radio" value="monthly" name="user-growth" checked>По месеци</input>
                                <input type="radio" value="daily" name="user-growth">По дни</input>
                            </div>
                            <div style="height: 200px;">
                                <canvas id="users-chart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="column is-3">
                        <div class="box">
                            <h2 class="title is-6">Публикувани събития</h2>
                            <div>
                                <input type="radio" value="monthly" name="event-growth" checked>По месеци</input>
                                <input type="radio" value="daily" name="event-growth">По дни</input>
                            </div>
                            <div style="height: 200px;">
                                <canvas id="events-chart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="column is-3">
                        <div class="box">
                            <h2 class="title is-6">Купени билети</h2>
                            <div>
                                <input type="radio" value="monthly" name="ticket-growth" checked>По месеци</input>
                                <input type="radio" value="daily" name="ticket-growth">По дни</input>
                            </div>
                            <div style="height: 200px;">
                                <canvas id="tickets-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </main>

    <script src="/js/pages/admin.js" type="module"></script>
</body>

</html>
